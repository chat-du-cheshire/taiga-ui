<tui-textfield iconStart="@tui.search">
    <input
        placeholder="Search"
        tuiTextfield
        [(ngModel)]="query"
    />
</tui-textfield>

<nav
    tuiTabs
    class="t-tabs"
    [tuiIconTabs]="list"
>
    <button
        *ngFor="let group of groups"
        tuiTab
        type="button"
        [attr.aria-label]="group.label"
    >
        <tui-icon [icon]="group.icon" />
    </button>
</nav>

<tui-scrollbar class="t-scroll">
    <tui-icon-list #list="tuiIconList">
        <tui-icon-group
            *ngFor="let group of groups"
            [label]="group.label"
        >
            <button
                *ngFor="let item of group.items"
                tuiIconOption
                type="button"
                [attr.aria-label]="item.name"
                (click)="picked = item"
            >
                {{ item.value }}
            </button>
        </tui-icon-group>
    </tui-icon-list>
</tui-scrollbar>

<p class="t-picked">{{ picked?.value || '—' }} {{ picked?.name }}</p>
