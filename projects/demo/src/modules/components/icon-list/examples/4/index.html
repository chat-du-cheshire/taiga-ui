<tui-textfield
    tuiChevron
    [content]="value && content"
    [stringify]="stringify"
    [tuiDropdownLimitWidth]="'auto'"
>
    <input
        placeholder="Pick an emoji"
        tuiSelect
        [(ngModel)]="value"
    />

    <div
        *tuiTextfieldDropdown
        class="t-panel"
    >
        <!--
            A plain input rather than a nested tui-textfield: inside the dropdown
            of another textfield the inner one binds to the outer through DI and
            its ngModel never fires.
        -->
        <input
            placeholder="Search"
            class="t-search"
            (input)="query.set($any($event.target).value)"
        />

        <nav
            tuiTabs
            class="t-tabs"
            [tuiIconTabs]="list"
        >
            <button
                *ngFor="let group of groups()"
                tuiTab
                type="button"
                [attr.aria-label]="group.label"
            >
                <tui-icon [icon]="group.icon" />
            </button>
        </nav>

        <tui-scrollbar class="t-scroll">
            <tui-icon-list #list="tuiIconList">
                <tui-icon-group
                    *ngFor="let group of groups()"
                    [label]="group.label"
                >
                    <button
                        *ngFor="let item of group.items"
                        new
                        tuiIconOption
                        tuiOption
                        type="button"
                        [attr.aria-label]="item.name"
                        [value]="item"
                    >
                        <!--
                            The alt is the glyph itself, so an unreachable CDN
                            degrades to the platform emoji instead of a gap.
                        -->
                        <img
                            class="t-emoji"
                            [alt]="item.value"
                            [src]="item.url"
                        />
                    </button>
                </tui-icon-group>
            </tui-icon-list>
        </tui-scrollbar>
    </div>
</tui-textfield>

<!-- The closed field shows the same image, which `stringify` alone cannot do -->
<ng-template
    #content
    let-item
>
    <img
        class="t-value"
        [alt]="item.value"
        [src]="item.url"
    />

    {{ item.name }}
</ng-template>
