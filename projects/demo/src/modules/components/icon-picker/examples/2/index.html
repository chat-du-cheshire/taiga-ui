<tui-icon-picker
    class="t-picker"
    [groups]="groups"
    [itemTemplate]="icon"
    [query]="query"
    [value]="value"
    (valueChange)="onPick($event)"
>
    <tui-textfield iconStart="@tui.search">
        <input
            placeholder="Search icons"
            tuiTextfield
            [(ngModel)]="query"
        />
    </tui-textfield>
</tui-icon-picker>

<ng-template
    #icon
    let-item
>
    <tui-icon [icon]="item.value" />
</ng-template>
